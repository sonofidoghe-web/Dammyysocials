<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — Dammy Social</title>
<style>
  :root{
    --green:#7C9C3F;
    --green-dark:#6c8a35;
    --text:#1a1a1a;
    --gray-text:#4b4b4b;
    --border:#e2e2e2;
    --placeholder:#9a9a9a;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body.dark{
    --text:#f2f2f2;
    --gray-text:#c7c7c7;
    --border:#3a3a3a;
    --placeholder:#8a8a8a;
    --bg:#15171a;
  }
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition:background .2s ease, color .2s ease;
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
  }
  .logo-wrap{
    display:flex;
    align-items:center;
  }
  .logo-wrap img{
    height:34px;
    width:auto;
    display:block;
  }
  .header-icons{
    display:flex;
    align-items:center;
    gap:22px;
  }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
  }
  .icon-btn svg{
    width:22px;
    height:22px;
  }

  /* Main */
  main{
    max-width:520px;
    margin:0 auto;
    padding:36px 24px 60px;
  }
  h1.title{
    font-size:40px;
    font-weight:800;
    margin:0 0 10px;
    letter-spacing:-0.5px;
  }
  p.subtitle{
    font-size:16px;
    color:var(--gray-text);
    margin:0 0 26px;
  }

  .google-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    cursor:pointer;
    margin-bottom:22px;
  }
  .google-btn svg{
    width:20px;
    height:20px;
    flex-shrink:0;
  }
  .google-btn span{
    flex:1;
    text-align:center;
    margin-right:20px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
    color:var(--gray-text);
    font-size:15px;
  }
  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }

  label{
    display:block;
    font-weight:700;
    font-size:15px;
    margin-bottom:8px;
  }
  .field{
    margin-bottom:20px;
  }
  input[type="email"],
  input[type="password"],
  input[type="text"]{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:16px;
    background:var(--bg);
    color:var(--text);
    outline:none;
  }
  input::placeholder{
    color:var(--placeholder);
  }
  input:focus{
    border-color:var(--green);
  }

  .password-wrap{
    position:relative;
  }
  .password-wrap input{
    padding-right:46px;
  }
  .toggle-eye{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text);
    padding:2px;
    display:flex;
  }
  .toggle-eye svg{
    width:20px;
    height:20px;
  }

  .name-row{
    display:flex;
    gap:16px;
  }
  .name-row .field{
    flex:1;
  }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:600;
  }
  .remember input{
    width:18px;
    height:18px;
    accent-color:var(--green);
    cursor:pointer;
  }
  a.link-green, .link-green{
    color:var(--green);
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  a.link-green:hover, .link-green:hover{
    text-decoration:underline;
  }

  .signin-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--green);
    color:#fff;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    margin-bottom:22px;
  }
  .signin-btn:hover{
    background:var(--green-dark);
  }
  .signin-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }

  .bottom-text{
    text-align:center;
    font-size:15px;
    color:var(--gray-text);
  }

  .msg-box{
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
    margin-bottom:20px;
    display:none;
    border:1px solid transparent;
  }
  .msg-box.show{
    display:block;
  }
  .msg-box.msg-error{
    background:#fdecea;
    color:#b3261e;
    border-color:#f5c6c2;
  }
  .msg-box.msg-success{
    background:#e9f5e1;
    color:#2f6b1f;
    border-color:#c3e6b1;
  }
  body.dark .msg-box.msg-error{
    background:#3a1f1e;
    border-color:#5c2c29;
    color:#f5a6a1;
  }
  body.dark .msg-box.msg-success{
    background:#1f3a1c;
    border-color:#335c2c;
    color:#a6e59a;
  }

  @media (max-width:480px){
    h1.title{ font-size:34px; }
    main{ padding:28px 18px 48px; }
  }
  @media (max-width:360px){
    .name-row{
      flex-direction:column;
      gap:0;
    }
  }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCbCBQNB2zvaq-zoCNh81EdbE7_PsnKDBI",
    authDomain: "dammysocials-2b126.firebaseapp.com",
    projectId: "dammysocials-2b126",
    storageBucket: "dammysocials-2b126.firebasestorage.app",
    messagingSenderId: "1052998476146",
    appId: "1:1052998476146:web:46ecb610aa1a23f8a0bdeb",
    measurementId: "G-TBFDQZMGXS"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  const msgBox = document.getElementById('msgBox');
  const signupForm = document.getElementById('signupForm');
  const signupBtn = document.getElementById('signupBtn');
  const googleBtn = document.getElementById('googleSignIn');

  function showMessage(type, message){
    // type: 'success' or 'error'
    msgBox.textContent = message;
    msgBox.classList.remove('msg-success', 'msg-error');
    msgBox.classList.add(type === 'success' ? 'msg-success' : 'msg-error', 'show');
  }
  function clearMessage(){
    msgBox.textContent = '';
    msgBox.classList.remove('show', 'msg-success', 'msg-error');
  }

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage();
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating account...';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: `${firstName} ${lastName}`.trim() });
      showMessage('success', 'Account created successfully. Redirecting...');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } catch (err) {
      showMessage('error', mapAuthError(err.code));
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create account';
    }
  });

  googleBtn.addEventListener('click', async () => {
    clearMessage();
    try {
      await signInWithPopup(auth, googleProvider);
      showMessage('success', 'Account created successfully. Redirecting...');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } catch (err) {
      showMessage('error', mapAuthError(err.code));
    }
  });

  function mapAuthError(code){
    switch(code){
      case 'auth/email-already-in-use': return 'An account with that email already exists.';
      case 'auth/invalid-email': return 'That email address looks invalid.';
      case 'auth/weak-password': return 'Password should be at least 8 characters.';
      case 'auth/popup-closed-by-user': return 'Google sign-up was closed before completing.';
      case 'auth/too-many-requests': return 'Too many attempts. Try again later.';
      default: return 'Something went wrong. Please try again.';
    }
  }

  // Password visibility toggle
  const toggleEye = document.getElementById('toggleEye');
  const passwordInput = document.getElementById('password');
  toggleEye.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleEye.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  // Dark mode toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });
</script>

</body>
</html>
